name: Build deploy branch

# On every push to main: build the site for the domain root and publish the
# result to the `deploy` branch. Hostinger Git pulls that branch (via webhook).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build for site root
        run: npm run build -- --outDir "$RUNNER_TEMP/site" --emptyOutDir
        env:
          VITE_BASE: /

      - name: Prepare files
        run: |
          rm -f "$RUNNER_TEMP/site/api/config.php" "$RUNNER_TEMP/site/api/config.local.php"
          sed -i 's#RewriteBase /enliteeducations/#RewriteBase /#; s#under /enliteeducations/#at the site root#' "$RUNNER_TEMP/site/.htaccess"

      - name: Publish to deploy branch
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git clone -q --branch deploy "$REPO" "$RUNNER_TEMP/deploy"
          cd "$RUNNER_TEMP/deploy"
          git rm -rq . || true
          cp -a "$RUNNER_TEMP/site/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy"; exit 0; fi
          git commit -q -m "Deploy build from ${GITHUB_SHA::7}"
          git push origin deploy
